<app-page-header title="物理磁盘" description="识别、检查并管理连接到本机的物理磁盘。">
  <button page-actions mat-flat-button type="button">重新扫描</button>
</app-page-header>

<table mat-table [dataSource]="disks">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>名称</th>
    <td mat-cell *matCellDef="let disk">{{ disk.name }}</td>
  </ng-container>

  <ng-container matColumnDef="mediaType">
    <th mat-header-cell *matHeaderCellDef>介质</th>
    <td mat-cell *matCellDef="let disk">{{ disk.mediaType }}</td>
  </ng-container>

  <ng-container matColumnDef="capacity">
    <th mat-header-cell *matHeaderCellDef>容量</th>
    <td mat-cell *matCellDef="let disk">{{ disk.capacity }}</td>
  </ng-container>

  <ng-container matColumnDef="busType">
    <th mat-header-cell *matHeaderCellDef>总线</th>
    <td mat-cell *matCellDef="let disk">{{ disk.busType }}</td>
  </ng-container>

  <ng-container matColumnDef="health">
    <th mat-header-cell *matHeaderCellDef>健康状态</th>
    <td mat-cell *matCellDef="let disk">{{ disk.health }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
