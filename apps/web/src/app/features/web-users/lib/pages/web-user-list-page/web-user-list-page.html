<app-page-header title="Web 用户" subtitle="管理平台账户与固定角色；这些账户不会自动成为 SMB 用户。" />

<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>创建用户</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="createForm" (ngSubmit)="createUser()">
      <mat-form-field>
        <mat-label>用户名</mat-label>
        <input matInput formControlName="userName" autocomplete="off" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>显示名称</mat-label>
        <input matInput formControlName="displayName" autocomplete="off" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>初始密码</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>角色</mat-label>
        <mat-select formControlName="role">
          @for (role of roles; track role) {
            <mat-option [value]="role">{{ role }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <button mat-flat-button type="submit" [disabled]="loading()">创建</button>
    </form>
  </mat-card-content>
</mat-card>

@if (errorMessage()) {
  <p role="alert">{{ errorMessage() }}</p>
}

<table mat-table [dataSource]="users()">
  <ng-container matColumnDef="userName">
    <th mat-header-cell *matHeaderCellDef>用户名</th>
    <td mat-cell *matCellDef="let user">{{ user.userName }}</td>
  </ng-container>
  <ng-container matColumnDef="displayName">
    <th mat-header-cell *matHeaderCellDef>显示名称</th>
    <td mat-cell *matCellDef="let user">{{ user.displayName }}</td>
  </ng-container>
  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>角色</th>
    <td mat-cell *matCellDef="let user">
      <mat-select [value]="user.role" (selectionChange)="changeRole(user, $event.value)">
        @for (role of roles; track role) {
          <mat-option [value]="role">{{ role }}</mat-option>
        }
      </mat-select>
    </td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>状态</th>
    <td mat-cell *matCellDef="let user">{{ user.isEnabled ? '已启用' : '已禁用' }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>操作</th>
    <td mat-cell *matCellDef="let user">
      <button mat-button type="button" (click)="toggleEnabled(user)" [disabled]="loading()">
        {{ user.isEnabled ? '禁用' : '启用' }}
      </button>
      <button mat-button type="button" (click)="deleteUser(user)" [disabled]="loading()">
        删除
      </button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
